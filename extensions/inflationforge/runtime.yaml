schema_version: '1'
id: inflationforge
version: 1.0.0
runtime_type: HTTP_SERVICE
endpoint_env: PEOPLEPAY_INFLATIONFORGE_API_URL
capabilities:
  price.observe: price_intelligence
jurisdictions: ['*']
input_fields: [product, quantity, destination]
