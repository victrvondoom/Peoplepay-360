[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peoplepay-extension-sdk"
version = "1.0.0"
description = "Versioned contracts and conformance helpers for PeoplePay capability extensions"
requires-python = ">=3.11"
dependencies = ["pydantic>=2.10,<3"]

[tool.setuptools.packages.find]
where = ["src"]
