[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "peoplepay-hypergrid"
version = "0.1.0"
description = "Evidence-aware incremental computation, worker grid and cost-aware routing benchmarks for PeoplePay"
requires-python = ">=3.11"
dependencies = ["numpy>=1.26"]

[project.optional-dependencies]
test = ["pytest>=8"]

[tool.setuptools.packages.find]
where = ["src"]

# The World Bank snapshot is read at run time by hypergrid.corpus, so it has to travel with the package.
[tool.setuptools.package-data]
hypergrid = ["data/*.json"]
