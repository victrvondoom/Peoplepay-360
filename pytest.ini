# Root-level pytest config for the integration layer only.
#
# The five acquired projects each have their own suites and their own runners;
# collecting them from here fails (duplicate basenames across projects, and
# CONSUMER-main raises ImportPathMismatchError).  So testpaths names only the
# integration tests that live at this level and exercise `transaction/` and
# `adapters/`.
#
# Beacon's own suite is unaffected: it has its own [tool.pytest.ini_options] in
# Beacon-main/pyproject.toml and is run from inside Beacon-main.
[pytest]
testpaths = tests
norecursedirs = Beacon-main CONSUMER-main Inflation-Forge-main inheir.ai-main rumi-main node_modules .git
